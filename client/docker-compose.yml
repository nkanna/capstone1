services:
  react-dev:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=1
      - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:3000}
    tty: true
